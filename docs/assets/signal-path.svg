<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">TapeBytes file-to-cassette workflow</title><desc id="desc">Encode files into a stereo WAV. Record left-channel data and right-channel reference on cassette. Play both channels into Decode to recover verified files.</desc>
<rect width="1200" height="560" rx="24" fill="#101322"/>
<g font-family="sans-serif" fill="#f3f2fa"><text x="52" y="65" font-size="30" font-weight="700">FILES → AUDIO → CASSETTE → FILES</text><text x="52" y="102" fill="#b8bed3" font-size="18">Default stereo mode · left: data · right: 3 kHz timing reference</text></g>
<g stroke="#465170" fill="#1a1f33" stroke-width="2"><rect x="50" y="155" width="300" height="115" rx="12"/><rect x="450" y="155" width="300" height="115" rx="12"/><rect x="850" y="155" width="300" height="115" rx="12"/><rect x="850" y="365" width="300" height="115" rx="12"/><rect x="450" y="365" width="300" height="115" rx="12"/><rect x="50" y="365" width="300" height="115" rx="12"/></g>
<g font-family="sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#c4adff"><text x="200" y="201">1. FILES</text><text x="600" y="201">2. ENCODE</text><text x="1000" y="201">3. RECORD</text><text x="1000" y="411">4. PLAY TAPE</text><text x="600" y="411">5. DECODE</text><text x="200" y="411">6. VERIFIED FILES</text></g>
<g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#b8bed3"><text x="200" y="239">Select a small file or folder</text><text x="600" y="239">Generate a stereo WAV</text><text x="1000" y="239">LINE OUT → deck LINE IN</text><text x="1000" y="449">Deck LINE OUT → LINE IN</text><text x="600" y="449">Capture L + R or import WAV</text><text x="200" y="449">CRC32 + SHA-256 checks</text></g>
<g stroke="#67dde6" stroke-width="4" fill="none"><path d="M365 213h65m-12-9 12 9-12 9M765 213h65m-12-9 12 9-12 9M1000 285v60m-9-12 9 12 9-12M830 423h-65m12-9-12 9 12 9M430 423h-65m12-9-12 9 12 9"/></g>
<text x="600" y="530" fill="#b8bed3" font-family="sans-serif" font-size="17" text-anchor="middle">Press REC and PLAY on the physical deck. Keep the two channels separate.</text></svg>
